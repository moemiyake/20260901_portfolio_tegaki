<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/destyle.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <section class="fixed_menu">
        <div class="humburger">
            <!-- ハンバーガーメニューボタン -->
            <span class="line"></span>
            <span class="line"></span>
        </div>
        <div class="page_name">
            <p>MoeMiyake</p>
        </div>
    </section>

    <section class="home">
        <div class="fv">
            <div class="name">
                <img src="img/mv.png" alt="MOE MIYAKE">
            </div>
            <div class="fv_photo">
                <img class="house" src="img/fv_photo.png" alt="house">
                <img class="green" src="img/fv_photo.png" alt="green photo">
            </div>
        </div>

        <div class="works">
            <h2>Works</h2>
            <div class="work_list">
                <div class="work_item">
                    <img src="img/work1.png" alt="Work 1">
                </div>
                <div class="work_item">
                    <img src="img/work2.png" alt="Work 2">
                </div>
                <div class="work_item">
                    <img src="img/work3.png" alt="Work 3">
                </div>
            </div>
            <div class="more">
                <p>More</p>
                <img src="img/arrow.png" alt="arrow">
            </div>
        </div>

        <div class="profile">
            <h2>Profile</h2>
            <div class="profile_content">
                <div class="profile_photo">
                    <img src="img/profile.png" alt="Profile Photo">
                </div>
                <div class="profile_name">
                    <p>三宅 萌（みやけ もえ）</p>
                    <p>Moe Miyake</p>
                </div>
                <div class="profile_text">
                    <p>
                        「コツコツやれば何でも作れる」という言葉をモットーに、丁寧かつスピーディに制作をします。<br>
                        親しみやすさと、ユーザーの心を動かすデザイン制作を目指しています。<br>
                        <br>
                        特技は、小さな子供と仲良くなること。
                    </p>
                </div>
            </div>
            <div class="more">
                <p>More</p>
                <img src="img/arrow.png" alt="arrow">
            </div>
        </div>

    </section>

    <footer>
        <a class="to_top">
            <img src="img/to_top.png" alt="To Top">
        </a>
        <div class="footer_menu">
            <ul>
                <li><a href="#">Top</a></li>
                <li><a href="#">Works</a></li>
                <li><a href="#">About</a></li>
            </ul>
        </div>
        <p>© 2026 Moe Miyake</p>
    </footer>

    <script src="js/script.js"></script>
</body>

</html>
