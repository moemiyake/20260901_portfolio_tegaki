        <h2>Works</h2>
        <div class="work_list">

    <section class="about">

        <div class="about__box">
            <div class="about__head">

                    <img src="img/profile.png" alt="Profile Photo">
                </div>
                <div class="about__name">
                    <p class="about__name--ja">三宅 萌（みやけ もえ）</p>
                    <p class="about__name--en">Moe Miyake</p>
                </div>
            </div>
            <div class="about__text">

                    「コツコツやれば何でも作れる」という言葉をモットーに、丁寧かつスピーディに制作をします。<br>
                    親しみやすさと、ユーザーの心を動かすデザイン制作を目指しています。<br>
                    <br>
                    特技は、小さな子供と仲良くなること。
                </p>
            </div>
        </div>
        <div class="about__more"></div>
        <a class="button button--more" href="">

            <img class="button__arrow" src="img/arrow.png" alt="もっと見る">
        </a>
        </div>
